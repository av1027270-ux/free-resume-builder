<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Resume Builder | ITM Recruitment Services</title><meta name="description" content="Create a free professional resume for freshers and experienced job seekers. Print or save your resume as PDF."><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#eef2f7;color:#17243a}header{background:#073b83;color:white;padding:24px;text-align:center}header a{color:white}main{max-width:1100px;margin:24px auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}form,article{background:white;padding:24px;border-radius:10px}label{display:block;margin:12px 0;font-weight:600}input,textarea{display:block;width:100%;padding:10px;border:1px solid #aab5c5;border-radius:5px;font:inherit;margin-top:5px}textarea{min-height:85px}button{background:#073b83;color:white;border:0;padding:12px 20px;border-radius:6px;font:inherit;cursor:pointer}article{overflow-wrap:anywhere}article h1{font-size:30px;margin:0;color:#073b83}article h2{font-size:17px;border-bottom:1px solid #aab5c5;padding-bottom:5px;margin-top:24px}article p{white-space:pre-wrap}footer{text-align:center;padding:20px}@media(max-width:750px){main{grid-template-columns:1fr}}@media print{header,form,footer{display:none}body,main{background:white;margin:0;padding:0;display:block}article{padding:0;border-radius:0}section{break-inside:avoid}@page{size:A4;margin:16mm}}</style></head><body><header><h1>Free Resume Builder</h1><p>By <a href="https://itmrecruitment.com/">ITM Recruitment Services</a></p></header><main><form id="editor"><h2>Enter your details</h2><p>Your details stay in this page and are not submitted to a server by this tool.</p><label>Full name<input id="name" autocomplete="name"></label><label>Job title<input id="role"></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone" type="tel"></label><label>City<input id="city"></label><label>Career objective<textarea id="summary"></textarea></label><label>Education<textarea id="education" placeholder="Degree, institution, year"></textarea></label><label>Work experience<textarea id="experience" placeholder="Company, role, dates and responsibilities (leave blank if fresher)"></textarea></label><label>Skills<textarea id="skills"></textarea></label><label>Languages<textarea id="languages"></textarea></label><label>Certifications / Projects<textarea id="projects"></textarea></label><button type="button" id="print">Print / Save as PDF</button></form><article id="resume"><h1 id="outName">Your Name</h1><p id="outRole"></p><p id="outContact"></p><div id="sections"></div></article></main><footer><a href="https://itmrecruitment.com/">Find jobs at ITM Recruitment Services</a></footer><script>const get=id=>document.getElementById(id);function render(){get('outName').textContent=get('name').value.trim()||'Your Name';get('outRole').textContent=get('role').value;get('outContact').textContent=['email','phone','city'].map(k=>get(k).value.trim()).filter(Boolean).join(' | ');const box=get('sections');box.replaceChildren();for(const [id,title] of [['summary','Career Objective'],['education','Education'],['experience','Work Experience'],['skills','Skills'],['languages','Languages'],['projects','Certifications / Projects']]){const value=get(id).value.trim();if(!value)continue;const section=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=value;section.append(h,p);box.append(section)}}get('editor').addEventListener('input',render);get('editor').addEventListener('submit',e=>e.preventDefault());get('print').addEventListener('click',()=>{if(!get('name').value.trim()){alert('Please enter your full name.');get('name').focus();return}render();window.print()});render();</script></body></html>
